; PiESC firmware - ขั้นที่ 1: LED กะพริบ (GPIO25) + พิมพ์ข้อความทาง USB
; หมายเหตุ: PlatformIO ทางการยังไม่รองรับ RP2350 ต้องใช้ platform fork ด้านล่าง
[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = picosdk
monitor_speed = 115200
build_flags =
    -DPICO_STDIO_USB=1
